<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<title>סינון שחקנים לפי הגעה למינימום</title>
</head>
<body>
<h2>סינון שחקנים שהגיעו למינימום שעות</h2>

<textarea id="inputData" rows="20" cols="120" placeholder="הדבק כאן את הנתונים המלאים"></textarea><br/>
<button onclick="filterReached()">הצג רק מי שהגיע מינימום</button>
<button onclick="filterNotReached()">הצג רק מי שלא הגיע מינימום</button>

<div id="result" style="margin-top:20px; white-space: pre-wrap;"></div>

<script>
function filterReached() {
    const input = document.getElementById("inputData").value;
    const lines = input.split("\n");
    let output = "";

    for (const line of lines) {
        if(line.includes("הגיע מינימום")) {
            output += line + "\n";
        }
    }
    if(!output) output = "לא נמצאו שחקנים שהגיעו למינימום.";
    document.getElementById("result").textContent = output;
}

function filterNotReached() {
    const input = document.getElementById("inputData").value;
    const lines = input.split("\n");
    let output = "";

    for (const line of lines) {
        // 'לא הגיע מינימום' או 'לא הגיע חצי מינימום' או כל טקסט שמכיל "לא הגיע"
        if(line.includes("לא הגיע")) {
            output += line + "\n";
        }
    }
    if(!output) output = "לא נמצאו שחקנים שלא הגיעו למינימום.";
    document.getElementById("result").textContent = output;
}
</script>
</body>
</html>
